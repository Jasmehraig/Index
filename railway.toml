# Railway config — https://docs.railway.app
# Deploy: `railway up` or connect the GitHub repo. Set BOT_TOKEN and
# PUBLIC_BASE_URL as service variables. Add a volume mounted at /app/data
# to persist the SQLite database between deploys.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
