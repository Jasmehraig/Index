<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Anime Swordsmith Index</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="channelsBtn" class="icon-btn" aria-label="Channels">▦</button>
      <div class="brand">
        <span class="brand-mark">▶</span>
        <span class="brand-name">Anime Swordsmith <em>Index</em></span>
      </div>
      <button id="topBtn" class="icon-btn" aria-label="Top">↑</button>
    </header>

    <div class="search-wrap">
      <div class="search">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="Search anime…" autocomplete="off" />
        <button id="clearBtn" class="clear-btn" hidden>✕</button>
      </div>
    </div>

    <nav id="genreBar" class="chips"></nav>

    <main>
      <section id="hero" class="hero" hidden></section>

      <section id="rails">
        <div class="rail-block" id="popularBlock" hidden>
          <div class="rail-head">
            <h2>Most Popular</h2>
            <span class="rail-hint">swipe ›</span>
          </div>
          <div class="rail" id="popularRail"></div>
        </div>

        <div class="rail-block" id="ongoingBlock" hidden>
          <div class="rail-head">
            <h2>Ongoing</h2>
            <span class="rail-hint">swipe ›</span>
          </div>
          <div class="rail" id="ongoingRail"></div>
        </div>
      </section>

      <div class="section-head">
        <h2>All Anime</h2>
        <div class="sort-wrap">
          <label for="sortSelect">Sort</label>
          <select id="sortSelect">
            <option value="title">A – Z</option>
            <option value="popular">Most popular</option>
            <option value="score">Top rated</option>
            <option value="year">Newest</option>
            <option value="episodes">Most episodes</option>
            <option value="recent">Recently added</option>
          </select>
        </div>
      </div>

      <nav id="letterBar" class="chips letters"></nav>
      <section id="grid" class="grid"></section>
      <div id="empty" class="empty" hidden>
        <div class="empty-art">🍿</div>
        <h2>Nothing indexed yet</h2>
        <p>Add the bot to an anime channel as an admin and its posts will show up here automatically.</p>
      </div>
      <div id="loader" class="loader"><span></span></div>
    </main>
  </div>

  <div id="detail" class="detail" hidden></div>
  <div id="sheet" class="sheet" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
