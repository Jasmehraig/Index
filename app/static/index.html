<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swordsmith | Anime Index</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-brand">
      <span class="logo-icon">⚔️</span>
      <div class="logo-text">
        <h1>SWORDSMITH</h1>
        <span>Official Index</span>
      </div>
    </div>
    <div class="nav-links">
      <a href="#popular">Popular</a>
      <a href="#ongoing">Ongoing</a>
      <a href="#catalog">Catalog</a>
      <a href="https://t.me/official_swordsmith" target="_blank" class="btn-primary">Join Channel</a>
    </div>
  </nav>

  <!-- 1. Cinematic Hero Banner -->
  <header class="hero-container" id="hero-section">
    <!-- Injected via app.js -->
  </header>

  <main class="main-content">
    <!-- 2. Most Popular (Horizontal Big Posters) -->
    <section id="popular" class="rail-section">
      <div class="section-header">
        <h2>🔥 Most Popular</h2>
        <p>Top viewed titles on Swordsmith</p>
      </div>
      <div class="horizontal-rail" id="popular-rail">
        <div class="loading-spinner"></div>
      </div>
    </section>

    <!-- 3. Ongoing Anime (Horizontal Big Posters) -->
    <section id="ongoing" class="rail-section">
      <div class="section-header">
        <h2>⚡ Ongoing Series</h2>
        <p>Currently airing & updating weekly</p>
      </div>
      <div class="horizontal-rail" id="ongoing-rail">
        <div class="loading-spinner"></div>
      </div>
    </section>

    <!-- 4. Complete Catalog (Data-Rich Grid) -->
    <section id="catalog" class="catalog-section">
      <div class="section-header catalog-header">
        <div>
          <h2>📚 Complete Catalog</h2>
          <p id="catalog-count">Loading titles...</p>
        </div>
        <div class="controls">
          <input type="text" id="search-input" class="search-box" placeholder="Search anime...">
          <select id="sort-select" class="sort-box">
            <option value="title">A-Z</option>
            <option value="recent">Recently Added</option>
            <option value="score">Highest Rated</option>
            <option value="episodes">Most Episodes</option>
          </select>
        </div>
      </div>
      <div class="anime-grid" id="catalog-grid">
        <div class="loading-spinner"></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
