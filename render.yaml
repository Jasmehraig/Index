# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the web service plus a managed Postgres, so the catalog survives
# restarts and deploys. (The free Postgres expires after 30 days; switch it to a
# paid plan, or swap DATABASE_URL for Neon/Supabase, when that happens.)
#
# Alternative for SQLite instead of Postgres: drop the `databases:` block and set
#   - key: DATABASE_URL
#     value: sqlite:///./data/index.db
# then add a persistent disk mounted at /app/data (disks are not on the free tier).
databases:
  - name: index-db
    plan: free
    databaseName: index
    user: index

services:
  - type: web
    name: index-miniapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: index-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.6
